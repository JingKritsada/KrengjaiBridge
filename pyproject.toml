[project]
name = "kreng-jai-bridge"
version = "0.1.0"
description = "Proactive AI agent that speaks up for Thai teams: neutral nudges and provably anonymous feedback."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "fakeredis>=2.23",
    "line-bot-sdk>=3.11",
    "pythainlp>=5.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
