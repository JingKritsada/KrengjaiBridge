# Demo stack on one ECS. PostgreSQL and Redis run as containers because the competition
# IAM user cannot create RDS/DCS yet; switch DATABASE_URL / REDIS_URL to RDS and DCS
# endpoints when that permission is granted. No code change is needed.
services:
  app:
    build: ..
    env_file: ../.env.server
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [postgres, redis]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kjb
      POSTGRES_USER: kjb
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
